services:

  unlighthouse-runner:
    build: .
    image: unlighthouse-runner:local
    pull_policy: build
    container_name: unlighthouse-runner
    restart: unless-stopped

    environment:
      - TZ=${TZ:-UTC}
      - REPORTS_DIR=/reports
      - SITES_FILE=/app/sites.yml
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - MATTERMOST_WEBHOOK_URL=${MATTERMOST_WEBHOOK_URL:-}

    volumes:
      - ./sites.yml:/app/sites.yml:ro
      - ./crontab:/app/crontab:ro
      - ./reports:/reports
      # Scripts + config mounted as volumes -> changes are picked up without
      # an image rebuild. node_modules is preserved from the image via an
      # anonymous volume, otherwise js-yaml would be missing at runtime.
      - ./scripts:/app/scripts
      - /app/scripts/node_modules
      - ./unlighthouse.config.ts:/app/unlighthouse.config.ts:ro

    security_opt:
      - no-new-privileges:true

    # Chromium needs sufficient SHM or it crashes.
    shm_size: "2gb"

    # supercronic is the long-running PID 1 child. If it dies, the container is
    # effectively useless (no scheduled scans). pgrep is provided by busybox.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f supercronic >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M

  unlighthouse-api:
    # Same image as the runner — needs Chromium because the API spawns
    # run-all.js which executes unlighthouse-ci. The lockfile in /reports
    # ensures cron and on-demand runs never execute in parallel.
    build: .
    image: unlighthouse-runner:local
    pull_policy: build
    container_name: unlighthouse-api
    restart: unless-stopped

    depends_on:
      unlighthouse-runner:
        condition: service_healthy

    environment:
      - TZ=${TZ:-UTC}
      - REPORTS_DIR=/reports
      - SITES_FILE=/app/sites.yml
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - MATTERMOST_WEBHOOK_URL=${MATTERMOST_WEBHOOK_URL:-}
      - PORT=3000

    volumes:
      - ./sites.yml:/app/sites.yml:ro
      - ./reports:/reports
      - ./scripts:/app/scripts
      - /app/scripts/node_modules
      - ./unlighthouse.config.ts:/app/unlighthouse.config.ts:ro

    command: ["node", "/app/scripts/api-server.js"]

    security_opt:
      - no-new-privileges:true

    # Chromium needs sufficient SHM when on-demand runs fire.
    shm_size: "2gb"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 256M

  unlighthouse-web:
    image: nginx:alpine
    container_name: unlighthouse-web
    restart: unless-stopped

    depends_on:
      unlighthouse-runner:
        condition: service_healthy
      unlighthouse-api:
        condition: service_healthy

    volumes:
      - ./reports:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    security_opt:
      - no-new-privileges:true

    # nginx:alpine ships busybox `wget`. We probe the dashboard index, so a
    # missing/empty reports volume (no index.html) also surfaces as unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

    # NOTE: This service has neither `ports` nor `networks/labels` for a reverse
    # proxy. Pick ONE of the two example overrides to make the dashboard reachable:
    #   - docker-compose.override.example.yml     (direct port 8080)
    #   - docker-compose.traefik.example.yml      (Traefik integration)
    # Copy your choice to docker-compose.override.yml and adapt it.
