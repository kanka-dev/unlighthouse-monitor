server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Follow symlinks (latest -> 2026-04-28)
    disable_symlinks off;

    autoindex off;

    # Standard: Index-Dashboard
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Kein Caching der HTML-Reports, damit du immer den aktuellen siehst
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Assets (JS/CSS/Bilder) dürfen cachen
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
