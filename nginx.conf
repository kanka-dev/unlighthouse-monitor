server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Follow symlinks (latest -> 2026-04-28)
    disable_symlinks off;

    autoindex off;

    # Reverse-proxy the small trigger API (unlighthouse-api:3000).
    # The endpoint stays behind whatever auth Traefik enforces (Authentik).
    location /api/ {
        proxy_pass http://unlighthouse-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Default: serve the index dashboard
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # No caching for HTML reports so you always see the latest
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Assets (JS/CSS/images) may be cached
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
